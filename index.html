<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S. — The Georgia Collection</title>
    <link rel="stylesheet" href="style.css">
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ambient-background"></div>

    <header class="editorial-header">
        <p class="eyebrow">A CURATED COLLECTION</p>
        <h1>For Sharayu</h1>
        <div class="divider"></div>
        <p class="subtitle">Notes for Tbilisi. To be opened strictly on their designated dates.</p>
    </header>

    <main class="container">
        <div id="letters-grid" class="luxury-grid"></div>
    </main>

    <!-- The Minimalist Modal -->
    <div id="letter-modal" class="modal">
        <div class="modal-content premium-paper">
            <span class="close-btn">&times;</span>
            <p class="modal-eyebrow">ARCHIVE RECORD</p>
            <h2 id="modal-title" class="serif-title"></h2>
            <div class="modal-divider"></div>
            <div id="modal-body" class="editorial-text"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
