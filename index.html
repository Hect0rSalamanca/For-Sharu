<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Shawuu 🤍</title>
    <link rel="stylesheet" href="style.css">
    <!-- Maximalist Fonts: One chunky/fun, one handwriting, one clean -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Floating CDN Stickers will be injected here by JS -->
    <div id="floating-stickers"></div>
    
    <header class="scrapbook-header">
        <h1>For Sharayu</h1>
        <p class="subtitle">Your SEU Survival Kit. No peaking early. 🦷✨</p>
    </header>

    <main class="container">
        <div id="letters-grid" class="letters-grid"></div>
    </main>

    <!-- The Popup Modal -->
    <div id="letter-modal" class="modal">
        <div class="modal-content scrapbook-paper">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title" class="fun-font"></h2>
            <div id="modal-body" class="handwritten"></div>
            <div class="joke-box" id="modal-joke"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
