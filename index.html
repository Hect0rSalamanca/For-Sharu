<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Georgia Packet 💌</title>
    <link rel="stylesheet" href="style.css">
    <!-- Clean text font + Handwritten font for the letters -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Container for animated background stickers -->
    <div id="floating-stickers"></div>
    
    <header class="hero">
        <div class="glass-panel">
            <h1>For Sharayu 🤍</h1>
            <p class="subtitle">Your personal survival kit for SEU & Tbilisi.</p>
        </div>
    </header>

    <main class="container">
        <div id="letters-grid" class="letters-grid"></div>
    </main>

    <!-- The Popup Modal for Unlocked Letters -->
    <div id="letter-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title"></h2>
            <div id="modal-body" class="handwritten"></div>
            <div class="joke-box" id="modal-joke"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
