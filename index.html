<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Shawu 🤍</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Memory Photos & Interactive Stickers -->
    <div id="bg-photos-container"></div>
    <div id="floating-stickers"></div>
    <div class="glow-bg"></div>

    <!-- Background Audio (Replace 'song.mp3' with your audio file) -->
    <audio id="bg-music" loop src="song.mp3"></audio>

    <!-- Floating Music Toggle -->
    <button id="music-toggle" class="music-pill">
        <span class="music-icon">🎵</span>
        <span id="music-text">Tap anywhere for our song</span>
    </button>

    <header class="header">
        <div class="badge">SINCE IM NOT THERE IRL 💌</div>
        <h1>For Shawu 🤍</h1>
        <p class="subtitle">Open these letters whenever you miss me, a laugh, or a reminder of how proud I am of you.</p>
    </header>

    <main class="container">
        <!-- Spotify Special Playlist Feature -->
        <section class="spotify-section">
            <div class="spotify-card">
                <div class="spotify-info">
                    <span class="tag">SPECIAL PLAYLIST 🎧</span>
                    <h3>Made Especially For You</h3>
                    <p>Made this cus you love music.</p>
                </div>
                <div class="spotify-code-wrapper">
                    <!-- Replace 'spotify-code.png' with your actual Spotify code image -->
                    <img src="spotify-code.png" alt="Spotify Playlist Code" class="spotify-code-img" onerror="this.src='https://placehold.co/240x60/ffe3eb/e64980?text=Add+spotify-code.png';">
                </div>
            </div>
        </section>

        <!-- Letters Grid -->
        <div id="letters-grid" class="letters-grid"></div>
    </main>

    <!-- Modal Popup -->
    <div id="letter-modal" class="modal">
        <div class="modal-content glass-card">
            <span class="close-btn">&times;</span>
            <div class="modal-tag">SPECIAL DELIVERY 💌</div>
            <h2 id="modal-title"></h2>
            <div id="modal-body" class="handwritten"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
